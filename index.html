<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Récupération de Films – Kinou</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --text: #e8eaf6;
      --text2: #8b90b8;
      --accent: #5c6bc0;
      --accent2: #7986cb;
      --green: #4caf50;
      --yellow: #ffc107;
      --orange: #ff9800;
      --red: #f44336;
      --purple: #9c27b0;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }
    #app { display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .sidebar-logo { padding: 18px 16px 12px; font-size: 15px; font-weight: 700; color: var(--accent2); border-bottom: 1px solid var(--border); }
    .sidebar-logo span { color: var(--text2); font-weight: 400; font-size: 11px; display: block; margin-top: 2px; }
    .sidebar-section { padding: 10px 12px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); }
    .sidebar-item { padding: 8px 16px; cursor: pointer; border-radius: 6px; margin: 2px 8px; transition: background 0.15s; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
    .sidebar-item:hover { background: var(--surface2); color: var(--text); }
    .sidebar-item.active { background: var(--accent); color: #fff; }
    .sidebar-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .chef-count { margin-left: auto; font-size: 11px; background: var(--surface2); padding: 1px 6px; border-radius: 10px; }
    .sidebar-item.active .chef-count { background: rgba(255,255,255,0.2); }

    #topbar { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #topbar h1 { font-size: 16px; font-weight: 600; flex: 1; }
    .search-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text); font-size: 13px; width: 240px; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text2); }
    .btn { padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    #filters { padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .filter-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; font-size: 12px; transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .filter-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }

    #statsbar { padding: 8px 20px; display: flex; gap: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .stat { font-size: 12px; color: var(--text2); }
    .stat strong { color: var(--text); font-size: 14px; }

    #content { flex: 1; overflow-y: auto; padding: 0; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: var(--surface); padding: 10px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; cursor: pointer; white-space: nowrap; user-select: none; }
    thead th:hover { color: var(--text); }
    thead th.sorted { color: var(--accent2); }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 10px 14px; font-size: 13px; vertical-align: top; }
    .td-projet { font-weight: 500; }
    .td-prod { color: var(--text2); font-size: 12px; }
    .td-real { font-size: 12px; }
    .td-notes { color: var(--text2); font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-pas { background: rgba(139,144,184,0.15); color: var(--text2); }
    .badge-cours { background: rgba(255,193,7,0.15); color: var(--yellow); }
    .badge-recup { background: rgba(76,175,80,0.15); color: var(--green); }
    .badge-impossible { background: rgba(156,39,176,0.15); color: #ce93d8; }
    .badge-relance { background: rgba(92,107,192,0.2); color: var(--accent2); font-size: 10px; }

    .date-ok { color: var(--text2); font-size: 12px; }
    .date-yellow { color: var(--yellow); font-size: 12px; }
    .date-orange { color: var(--orange); font-size: 12px; }
    .date-red { color: var(--red); font-size: 12px; font-weight: 600; }
    .date-relance { color: var(--accent2); font-size: 12px; font-weight: 600; }

    .row-yellow { border-left: 3px solid var(--yellow); }
    .row-orange { border-left: 3px solid var(--orange); }
    .row-red { border-left: 3px solid var(--red); }
    .row-green { border-left: 3px solid var(--green); }
    .row-purple { border-left: 3px solid var(--purple); }
    .row-relance { border-left: 3px solid var(--accent2); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; }
    .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
    .modal-title { font-size: 17px; font-weight: 600; }
    .modal-sub { color: var(--text2); font-size: 13px; margin-top: 4px; }
    .modal-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; padding: 0 4px; }
    .modal-body { padding: 20px 24px; }
    .modal-section { margin-bottom: 20px; }
    .modal-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text2); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: var(--text2); }
    .field input, .field select, .field textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; font-family: var(--font); outline: none; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field select option { background: var(--surface2); }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

    /* EMAIL BOX */
    .email-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .email-tab { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; font-size: 12px; }
    .email-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .email-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; font-family: inherit; }
    .email-subject { font-size: 12px; color: var(--text2); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .email-subject strong { color: var(--text); }
    .trou { background: rgba(92,107,192,0.25); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; color: var(--accent2); cursor: text; outline: none; min-width: 20px; display: inline-block; }
    .trou:focus { background: rgba(92,107,192,0.4); }
    .trou:empty:before { content: attr(data-placeholder); color: var(--text2); font-style: italic; }

    /* VUE PRODUCTIONS */
    .prod-group { margin: 0 0 2px; }
    .prod-header { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.1s; position: sticky; top: 0; z-index: 5; }
    .prod-header:hover { background: var(--surface2); }
    .prod-name { font-weight: 600; font-size: 14px; flex: 1; }
    .prod-count { font-size: 12px; color: var(--text2); }
    .prod-email-btn { margin-left: auto; }
    .prod-films { }
    .prod-film-row { padding: 9px 20px 9px 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.1s; font-size: 13px; }
    .prod-film-row:hover { background: var(--surface2); }
    .prod-film-title { font-weight: 500; flex: 1.2; }
    .prod-film-real { color: var(--text2); flex: 1; font-size: 12px; }
    .prod-film-chef { color: var(--accent2); flex: 1; font-size: 12px; }
    .prod-film-status { flex: 0.8; }
    .prod-collapsed .prod-films { display: none; }

    /* RELANCES */
    .relance-group { margin-bottom: 24px; }
    .relance-group-title { font-size: 13px; font-weight: 600; padding: 12px 20px 8px; position: sticky; top: 0; background: var(--bg); z-index: 5; display: flex; align-items: center; gap: 8px; }
    .urgency-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .relance-card { margin: 0 20px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: border-color 0.15s; }
    .relance-card:hover { border-color: var(--accent); }
    .relance-card-info { flex: 1; min-width: 0; }
    .relance-card-title { font-weight: 500; font-size: 13px; }
    .relance-card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .relance-card-chef { font-size: 11px; color: var(--accent2); margin-top: 4px; }

    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .chef-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(92,107,192,0.2); color: var(--accent2); font-weight: 500; white-space: nowrap; }
    .notif { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--green); color: var(--text); padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 200; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo">🎬 Kinou<span>Récupération de films</span></div>
    <div id="nav-items"></div>
    <div style="margin-top:auto;padding:12px 8px;border-top:1px solid var(--border);display:flex;gap:6px;">
      <button id="gh-sync-btn" class="btn btn-ghost btn-sm" style="flex:1;font-size:11px;display:none;" onclick="pushDataToGithub()">↑ Sync *</button>

<!-- MODAL EMAIL GROUPÉ -->
<div id="modal-groupe" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModalGroupe()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-groupe-title">Email groupé</div>

<script>
let DATA = null;
let currentView = 'table'; // 'table' | 'relances' | 'productions'
let currentChefId = null;
let statusFilter = null;
let urgencyFilter = null;
let sortCol = 'urgency';
let sortDir = 1;
let editingProjet = null;
let currentEmailLang = 'fr';
let currentGroupeLang = 'fr';
let currentGroupeData = null;

// ===================== VERSION BANNER =====================
const APP_VERSION = '1.0.0';

(function checkVersion() {
  async function check() {
    try {
      const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const json = await res.json();
      if (json.version && json.version !== APP_VERSION) showVersionBanner();
    } catch {}
  }
  check();
  setInterval(check, 5 * 60 * 1000);
})();

function showVersionBanner() {
  if (document.getElementById('version-banner')) return;
  const b = document.createElement('div');
  b.id = 'version-banner';
  b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#4fa3ff;color:#111;font-size:13px;font-weight:600;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:12px;';
  b.innerHTML = '<span>Une nouvelle version est disponible.</span><button onclick="window.location.reload()" style="background:#111;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;">Recharger</button>';
  document.body.prepend(b);
}

// ===================== GITHUB SYNC =====================
const GH_USER = 'GusBZH';
const GH_REPO = 'k-recup';
const GH_FILE = 'data.json';
const GH_TOKEN_KEY = 'kinou_gh_token';

function getGhToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }

// Encode UTF-8 → base64 sans corrompre les accents (même méthode que Labyrinthe)
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

// SHA courant en mémoire — mis à jour après chaque push réussi
let _ghSha = null;

async function ghGet(token) {
  const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`, {
    cache: 'no-store',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  return j.sha;
}

let _saveTimeout = null;
let _unsaved = false;

function markUnsaved() {
  _unsaved = true;
  const btn = document.getElementById('gh-sync-btn');
  if (btn) btn.style.display = '';
}

function markSaved() {
  _unsaved = false;
  const btn = document.getElementById('gh-sync-btn');
  if (btn) btn.style.display = 'none';
}

// Auto-save avec debounce 2s
function scheduleAutoSave() {
  if (!getGhToken()) return;
  markUnsaved();
  clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(() => pushDataToGithub(true), 2000);
}

async function pushDataToGithub(silent = false) {
  const token = getGhToken();
  if (!token) { alert('Aucun token GitHub configuré. Clique ⚙️ pour en ajouter un.'); return; }
  const content = utf8ToBase64(JSON.stringify(DATA, null, 2));
  try {
    // Toujours lire le SHA frais pour éviter les conflits 409
    const freshSha = await ghGet(token);
    _ghSha = freshSha;
    const putRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Mise à jour K-Recup', content, sha: _ghSha })
    });
    if (!putRes.ok) {
      const err = await putRes.json().catch(()=>({}));
      throw new Error(err.message || `${putRes.status}`);
    }
    // Mettre à jour le SHA avec celui retourné par le PUT
    const putData = await putRes.json();
    _ghSha = putData.content.sha;
    markSaved();
    if (!silent) showNotif('✅ Données synchronisées sur GitHub !');
    else showNotif('💾 Sauvegarde auto OK');
  } catch(e) {
    if (!silent) alert(`Erreur GitHub : ${e.message}`);
    else showNotif(`⚠️ Sauvegarde auto échouée : ${e.message}`);
  }
}

// Alerte si on quitte sans sauvegarder
window.addEventListener('beforeunload', e => {
  if (_unsaved) { e.preventDefault(); e.returnValue = ''; }
});

function showGithubSettings() {
  const existing = document.getElementById('gh-settings-modal');
  if (existing) existing.remove();
  const token = getGhToken();
  const modal = document.createElement('div');
  modal.id = 'gh-settings-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9998;';
  modal.innerHTML = `
    <div style="background:#1a1d27;border:1px solid #2e3250;border-radius:12px;padding:32px 36px;min-width:360px;display:flex;flex-direction:column;gap:16px;">
      <div style="font-size:16px;font-weight:700;color:#e8eaf6;">⚙️ GitHub Token</div>
      <div style="font-size:12px;color:#8b90b8;line-height:1.6;">Token Personal Access (classic) avec permission <code style="background:#22263a;padding:1px 5px;border-radius:4px;">repo</code>.<br>Stocké uniquement dans ton navigateur.</div>

// ===================== HELPERS =====================
function daysSince(d) { if (!d) return null; return Math.floor((new Date() - new Date(d)) / 86400000); }
function daysUntil(d) { if (!d) return null; return Math.floor((new Date(d) - new Date()) / 86400000); }

function urgencyLevel(p) {
  if (p.statut === 'Récupéré') return 'recup';
  if (p.statut === 'Impossible !') return 'impossible';
  // Relance programmée aujourd'hui ou passée = priorité max
  if (p.date_relance) {
    const du = daysUntil(p.date_relance);
    if (du !== null && du <= 0) return 'relance';
  }
  // Date de sortie prévue proche
  if (p.date_sortie_prevue) {
    const du = daysUntil(p.date_sortie_prevue);
    if (du !== null && du <= 30) return 'red';
    if (du !== null && du <= 90) return 'orange';
  }
  const days = daysSince(p.dernier_contact);
  if (days === null) return 'red';
  if (days >= 90) return 'red';
  if (days >= 30) return 'orange';
  return 'yellow';
}

function getChefColor(id) {
  const colors = ['#5c6bc0','#26a69a','#ef5350','#ffa726','#ab47bc','#29b6f6','#66bb6a','#ec407a','#8d6e63','#78909c'];
  return colors[DATA.chef_ops.findIndex(c => c.id === id) % colors.length];
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Tronque le nom de projet après le premier point suivi d'une extension (.pub, .psd, etc.)
function cleanProjet(s) {
  if (!s) return s;
  return s.replace(/\.([a-zA-Z]{2,4})$/, '').replace(/\.([a-zA-Z]{2,4})\s/, ' ');
}

// Prénom du chef op (premier mot du nom)
function prenom(nom) { return (nom||'').split(' ')[0]; }

// Emoji genre pour un chef op (cherche d'abord dans chef_op.genre, sinon dans projet.genre)
function genreEmoji(genre) { return genre==='F'?'♀️':genre==='M'?'♂️':''; }

// Récupère le genre d'un chef op (niveau chef_op en priorité)
function getChefGenre(chefId) {
  const co = DATA.chef_ops.find(c=>c.id===chefId);
  if (!co) return '';
  if (co.genre) return co.genre;
  // fallback: premier projet avec genre renseigné
  const p = co.projets.find(pr=>pr.genre==='M'||pr.genre==='F');
  return p ? p.genre : '';
}

// Supprime les tirets em (—) et les remplace par rien ou par | selon le contexte
function noDash(s) { return (s||'').replace(/\s*—\s*/g, ' | ').replace(/^\s*\|\s*/, '').trim(); }

// Indique si on est en mode relance (depuis la vue relances ou relances-prod)
function isRelanceView() { return currentView==='relances'||currentView==='relances-prod'; }

function getBadge(statut) {
  const map = { 'Pas commencé':['badge-pas','Pas commencé'], 'En cours':['badge-cours','En cours'], 'Récupéré':['badge-recup','✓ Récupéré'], 'Impossible !':['badge-impossible','✕ Impossible'] };
  const [cls,label] = map[statut]||['badge-pas',statut];
  return `<span class="badge ${cls}">${label}</span>`;
}

function formatDate(dateStr, urgency) {
  if (!dateStr) return '<span class="date-red">Jamais</span>';
  const days = daysSince(dateStr);
  const d = new Date(dateStr).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'});
  const cls = {red:'date-red',orange:'date-orange',yellow:'date-yellow',recup:'date-ok',impossible:'date-ok',relance:'date-relance'}[urgency]||'date-ok';
  return `<span class="${cls}">${d} (${days}j)</span>`;
}

function getAllProjects() {
  const all = [];
  for (const co of DATA.chef_ops)
    for (const p of co.projets)
      all.push({...p, _chefId:co.id, _chefNom:co.nom, _urgency:urgencyLevel(p)});
  return all;
}

function setStatusFilter(s, btn) {

}

// ===================== TABLE =====================
function getFiltered() {
  let projects = getAllProjects();
  if (currentChefId) projects = projects.filter(p=>p._chefId===currentChefId);
  const q = document.getElementById('search')?.value?.toLowerCase()||'';
  if (q) projects = projects.filter(p=>
    p.projet.toLowerCase().includes(q)||p.production.toLowerCase().includes(q)||
    p.real.toLowerCase().includes(q)||p.notes.toLowerCase().includes(q)||
    p._chefNom.toLowerCase().includes(q));
  if (statusFilter) projects = projects.filter(p=>p.statut===statusFilter);
  if (urgencyFilter) projects = projects.filter(p=>p._urgency===urgencyFilter);
  const urgOrd = {relance:0,red:1,orange:2,yellow:3,recup:4,impossible:5};
  projects.sort((a,b)=>{
    let va,vb;
    if (sortCol==='urgency'){va=urgOrd[a._urgency]??6;vb=urgOrd[b._urgency]??6;}
    else if(sortCol==='projet'){va=a.projet;vb=b.projet;}
    else if(sortCol==='production'){va=a.production;vb=b.production;}
    else if(sortCol==='real'){va=a.real;vb=b.real;}
    else if(sortCol==='statut'){va=a.statut;vb=b.statut;}
    else if(sortCol==='dernier_contact'){va=a.dernier_contact||'';vb=b.dernier_contact||'';}
    else if(sortCol==='chef'){va=a._chefNom;vb=b._chefNom;}
    if(va<vb)return -sortDir; if(va>vb)return sortDir; return 0;
  });
  return projects;
}

function renderTable() {
  const projects = getFiltered();
  const showChef = !currentChefId;
  document.getElementById('page-title').textContent = currentChefId
    ? DATA.chef_ops.find(c=>c.id===currentChefId)?.nom||'Films' : 'Tous les films';

  const total = projects.length;
  const recup = projects.filter(p=>p.statut==='Récupéré').length;
  const urgent = projects.filter(p=>p._urgency==='red'||p._urgency==='relance').length;
  document.getElementById('statsbar').innerHTML = `
    <div class="stat"><strong>${total}</strong> projets</div>
    <div class="stat" style="color:var(--green)"><strong>${recup}</strong> récupérés</div>
    <div class="stat" style="color:var(--red)"><strong>${urgent}</strong> urgents</div>`;

  if (!projects.length) { document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>Aucun projet trouvé</p></div>'; return; }

  let html = `<table><thead><tr>
    <th onclick="sortBy('urgency')" class="${sortCol==='urgency'?'sorted':''}">↑</th>
    <th onclick="sortBy('projet')" class="${sortCol==='projet'?'sorted':''}">Projet</th>
    <th onclick="sortBy('production')" class="${sortCol==='production'?'sorted':''}">Production</th>
    <th onclick="sortBy('real')" class="${sortCol==='real'?'sorted':''}">Réal</th>
    ${showChef?`<th onclick="sortBy('chef')" class="${sortCol==='chef'?'sorted':''}">Chef op</th>`:''}
    <th onclick="sortBy('statut')" class="${sortCol==='statut'?'sorted':''}">Statut</th>
    <th onclick="sortBy('dernier_contact')" class="${sortCol==='dernier_contact'?'sorted':''}">Dernier contact</th>
    <th>Notes</th>
  </tr></thead><tbody>`;

  for (const p of projects) {
    const rc = {red:'row-red',orange:'row-orange',yellow:'row-yellow',recup:'row-green',impossible:'row-purple',relance:'row-relance'}[p._urgency]||'';
    const relanceBadge = p._urgency==='relance' ? `<span class="badge badge-relance">📅 Relance</span> ` : '';
    const chefGenre = getChefGenre(p._chefId);
    const ge = genreEmoji(chefGenre);
    html += `<tr class="${rc}" onclick="openModal('${p._chefId}',${p.id})">
      <td></td>
      <td class="td-projet">${relanceBadge}${esc(cleanProjet(p.projet))}</td>
      <td class="td-prod">${esc(p.production)}</td>
      <td class="td-real">${esc(p.real)}</td>
      ${showChef?`<td><span class="chef-badge">${ge?ge+' ':''}${esc(p._chefNom)}</span></td>`:''}
      <td>${getBadge(p.statut)}</td>
      <td>${formatDate(p.dernier_contact, p._urgency)}</td>
      <td class="td-notes">${esc(p.notes)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

function sortBy(col) { if(sortCol===col)sortDir*=-1; else{sortCol=col;sortDir=1;} renderTable(); }

// ===================== RELANCES =====================
function renderRelances() {
  document.getElementById('page-title').textContent = '📅 Relances';
  document.getElementById('statsbar').innerHTML = '';
  const all = getAllProjects().filter(p=>p.statut!=='Récupéré'&&p.statut!=='Impossible !');

  const groups = [
    { key:'relance', label:'Relances programmées', color:'var(--accent2)', items:[] },
    { key:'red', label:'Urgents (+90j ou sortie imminente)', color:'var(--red)', items:[] },
    { key:'orange', label:'À relancer (+30j)', color:'var(--orange)', items:[] },
    { key:'yellow', label:'En attente (-30j)', color:'var(--yellow)', items:[] },
  ];

  for (const p of all) { const g=groups.find(g=>g.key===p._urgency); if(g)g.items.push(p); }

  let html = '';
  for (const g of groups) {
    if (!g.items.length) continue;
    g.items.sort((a,b)=>(daysSince(a.dernier_contact)||9999)<(daysSince(b.dernier_contact)||9999)?1:-1);
    html += `<div class="relance-group"><div class="relance-group-title">
      <span class="urgency-dot" style="background:${g.color}"></span>${g.label} (${g.items.length})</div>`;
    for (const p of g.items) {
      const days = daysSince(p.dernier_contact);
      const dayStr = days===null?'Jamais contacté':`${days}j sans contact`;
      const relanceStr = p.date_relance && p._urgency==='relance' ? ` · Relance prévue ${new Date(p.date_relance).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}` : '';
      const ge2 = genreEmoji(getChefGenre(p._chefId));
      html += `<div class="relance-card" onclick="openModal('${p._chefId}',${p.id})">
        <div class="relance-card-info">
          <div class="relance-card-title">${esc(cleanProjet(p.projet))}</div>
          <div class="relance-card-sub">${esc(p.production)}${p.real?' | '+esc(p.real):''}</div>
          <div class="relance-card-chef">👤 ${ge2?ge2+' ':''}${esc(p._chefNom)} · ${dayStr}${relanceStr}</div>
          ${p.notes?`<div class="relance-card-sub" style="margin-top:4px;font-style:italic">${esc(p.notes)}</div>`:''}
        </div>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openModal('${p._chefId}',${p.id})">✉️ Email</button>
      </div>`;
    }
    html += '</div>';
  }
  if (!html) html = '<div class="empty"><div class="empty-icon">✅</div><p>Aucune relance !</p></div>';
  document.getElementById('content').innerHTML = html;
}

function renderRelancesProd() {

        <span style="color:var(--text2);margin-left:8px">▼</span>
      </div>
      <div class="prod-films">`;

    films.sort((a,b)=>(a.real||'').localeCompare(b.real||'')||(a.projet||'').localeCompare(b.projet||''));
    for (const p of films) {
      const ge = genreEmoji(getChefGenre(p._chefId));
      const urgColor = {red:'var(--red)',orange:'var(--orange)',relance:'var(--accent2)'}[p._urgency]||'var(--text2)';
      const days = daysSince(p.dernier_contact);
      const dayStr = days===null?'Jamais contacté':`${days}j sans contact`;
      const anneeStr2 = p.annee_tournage ? ` | Tourné en ${esc(p.annee_tournage)}` : '';
      html += `<div class="prod-film-row" onclick="openModal('${p._chefId}',${p.id})">
        <span class="prod-film-title">${esc(cleanProjet(p.projet))} | Chef op ${ge?ge+' ':''}${esc(p._chefNom)}${anneeStr2}</span>
        <span class="prod-film-real">${esc(p.real)}</span>
        <span style="font-size:11px;color:${urgColor}">${dayStr}</span>
        <span class="prod-film-status">${getBadge(p.statut)}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('content').innerHTML = html;
}

      <div class="prod-header" onclick="toggleProd(this)">
        <span class="prod-name">${esc(prodName)}</span>
        <span class="prod-count">${films.length} film${films.length>1?'s':''} à récupérer</span>
        ${urgentBadge}
        <button class="btn btn-primary btn-sm prod-email-btn" onclick="event.stopPropagation();openGroupeEmail('${esc(prodName)}')">✉️ Email groupé</button>
        <span style="color:var(--text2);margin-left:8px">▼</span>
      </div>
      <div class="prod-films">`;

    // Sort films by réal then by titre
    films.sort((a,b)=>(a.real||'').localeCompare(b.real||'')||(a.projet||'').localeCompare(b.projet||''));
    for (const p of films) {
      const ge3 = genreEmoji(getChefGenre(p._chefId));
      const anneeStr = p.annee_tournage ? ` | Tourné en ${esc(p.annee_tournage)}` : '';
      html += `<div class="prod-film-row" onclick="openModal('${p._chefId}',${p.id})">
        <span class="prod-film-title">${esc(cleanProjet(p.projet))} | Chef op ${ge3?ge3+' ':''}${esc(p._chefNom)}${anneeStr}</span>
        <span class="prod-film-real">${esc(p.real)}</span>
        <span class="prod-film-status">${getBadge(p.statut)}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('content').innerHTML = html;
}

function toggleProd(header) {
  header.parentElement.classList.toggle('prod-collapsed');
  header.querySelector('span:last-child').textContent = header.parentElement.classList.contains('prod-collapsed') ? '▶' : '▼';
}

// ===================== EMAIL GROUPÉ =====================
function openGroupeEmail(prodName) {
  const all = getAllProjects().filter(p=>p.production===prodName&&p.statut!=='Récupéré'&&p.statut!=='Impossible !');
  currentGroupeData = { prodName, films: all };
  currentGroupeLang = 'fr';

  document.getElementById('modal-groupe-title').textContent = `Email groupé — ${prodName}`;
  document.getElementById('modal-groupe-sub').textContent = `${all.length} film${all.length>1?'s':''} à demander`;

  // Films list (checkboxes to include/exclude)
  let listHtml = '';
  all.forEach((p,i) => {
    const genreIcon = p.genre==='F'?'♀️':p.genre==='M'?'♂️':'';
    listHtml += `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px">
      <input type="checkbox" checked data-idx="${i}" onchange="renderGroupeEmail()" style="accent-color:var(--accent)">
      <span>${esc(p.projet)}</span>
      <span style="color:var(--text2);font-size:12px">${p.real?'· '+esc(p.real):''}</span>
      <span style="color:var(--accent2);font-size:12px">${genreIcon} ${esc(p._chefNom)}</span>
    </label>`;
  });
  document.getElementById('groupe-films-list').innerHTML = listHtml;

  renderGroupeEmail();
  document.getElementById('modal-groupe').style.display = 'flex';
}

function getSelectedFilms() {
  const checks = document.querySelectorAll('#groupe-films-list input[type=checkbox]');
  return Array.from(checks).filter(c=>c.checked).map(c=>currentGroupeData.films[+c.dataset.idx]);
}

function renderGroupeEmail() {
  const films = getSelectedFilms();
  const { prodName } = currentGroupeData;
  const lang = currentGroupeLang;

  // Get unique chef op names
  const chefs = [...new Set(films.map(f=>f._chefNom))];
  const chefsStr = chefs.length===1 ? chefs[0] : chefs.length===2 ? chefs.join(' et ') : chefs.slice(0,-1).join(', ')+' et '+chefs.slice(-1);

  // Group films by réal
  const byReal = {};
  for (const f of films) {
    const key = f.real||'—';
    if (!byReal[key]) byReal[key] = [];
    byReal[key].push(f);
  }

  const isRelance = isRelanceView();
  let filmsList = '';
  for (const [real, rfilms] of Object.entries(byReal)) {
    if (lang==='fr') filmsList += `\nRéalisé par ${real} :\n`;
    else filmsList += `\nDirected by ${real}:\n`;
    for (const f of rfilms) {
      const ge = genreEmoji(getChefGenre(f._chefId));
      const annee = f.annee_tournage ? ` | Tourné en ${f.annee_tournage}` : '';
      filmsList += `\t• ${cleanProjet(f.projet)} | Chef op : ${ge?ge+' ':''}${f._chefNom}${annee}\n`;
    }
  }

  let subject, greeting, intro, outro;
  if (lang==='fr') {
    subject = `Récupération de films | Kinou`;
    greeting = `Hello l'équipe ${prodName},`;
    if (isRelance) {
      const nbFilms = films.length;
      intro = chefs.length<=3
        ? `Je me permets de vous relancer concernant ${nbFilms===1?'un film':'des films'} sur lequel ${chefs.length===1?chefsStr:chefsStr} ${chefs.length===1?'a':'ont'} travaillé.\nEst-ce que ce serait possible de nous envoyer ${nbFilms===1?'un lien pour le télécharger':'des liens pour les télécharger'} ?`
        : `Je me permets de vous relancer concernant ${nbFilms===1?'un film':'des films'} sur lesquels nos chef opérateurs ont travaillé.\nEst-ce que ce serait possible de nous envoyer ${nbFilms===1?'un lien pour le télécharger':'des liens pour les télécharger'} ?`;
    } else {
      intro = chefs.length<=3
        ? `Je cherche à récupérer certains films sur lesquels ${chefsStr} ${chefs.length===1?'a':'ont'} travaillé. Ce serait super si vous pouviez m'envoyer le master de ces films :`
        : `Je cherche à récupérer certains films sur lesquels nos chef opérateurs ont travaillé. Ce serait super si vous pouviez m'envoyer le master de ces films :`;
    }
    outro = `Merci d'avance pour votre aide !\nBelle journée,`;
  } else {
    subject = `Film recovery request | Kinou`;
    greeting = `Hi ${prodName} team,`;
    if (isRelance) {
      intro = chefs.length<=3
        ? `I'm following up regarding some films that ${chefsStr} ${chefs.length===1?'has':'have'} worked on. Have you had a chance to gather the master files for these:`
        : `I'm following up regarding some films that our directors of photography have worked on. Have you had a chance to gather the master files for these:`;
    } else {
      intro = chefs.length<=3
        ? `I'm looking to recover some films that ${chefsStr} ${chefs.length===1?'has':'have'} worked on. It would be great if you could send us the master files for these films:`
        : `I'm looking to recover some films that our directors of photography have worked on. It would be great if you could send us the master files for these films:`;
    }
    outro = `Thank you in advance for your help!\nHave a great day,`;
  }

  const body = `${greeting}\n\n${intro}\n${filmsList}\n${outro}`;

  document.getElementById('groupe-email-content').innerHTML = `
    <div class="email-subject"><strong>Objet :</strong> ${esc(subject)}</div>
    <div class="email-box" id="groupe-email-body">${esc(body)}</div>`;
}

function setGroupeLang(lang, btn) {
  currentGroupeLang = lang;
  document.querySelectorAll('#modal-groupe .email-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGroupeEmail();
}

function copyGroupeEmail() {
  const el = document.getElementById('groupe-email-body');
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(()=>showNotif('📋 Email copié !'));
}

function closeModalGroupe() { document.getElementById('modal-groupe').style.display='none'; }

// ===================== MODAL INDIVIDUEL =====================
function openModal(chefId, projetId) {
  const co = DATA.chef_ops.find(c=>c.id===chefId);
  const p = co.projets.find(pr=>pr.id===projetId);
  editingProjet = {chefId, projetId};
  currentEmailLang = 'fr';

  document.getElementById('modal-title').textContent = p.projet;
  document.getElementById('modal-sub').textContent = `${co.nom} · ${p.production||'Production inconnue'}`;
  document.getElementById('f-projet').value = p.projet;
  document.getElementById('f-production').value = p.production||'';
  document.getElementById('f-real').value = p.real||'';
  document.getElementById('f-statut').value = p.statut;
  document.getElementById('f-contact').value = p.dernier_contact||'';
  document.getElementById('f-sortie').value = p.date_sortie_prevue||'';
  document.getElementById('f-relance').value = p.date_relance||'';
  document.getElementById('f-annee').value = p.annee_tournage||'';
  document.getElementById('f-email').value = p.contact_email||'';
  document.getElementById('f-genre').value = co.genre||p.genre||'';
  document.getElementById('f-notes').value = p.notes||'';

  renderIndividualEmail(p, co.nom);
  document.getElementById('modal').style.display = 'flex';
}

function renderIndividualEmail(p, chefNom) {
  const lang = currentEmailLang;
  const genreIcon = p.genre==='F'?'♀️':p.genre==='M'?'♂️':'';
  const chefDisplay = `${genreIcon} ${chefNom}`.trim();

  const nomFilm = cleanProjet(p.projet)||'[Film]';
  const isRelance = isRelanceView();
  // Genre : priorité au champ du formulaire (live preview), sinon niveau chef op
  const formGenre = document.getElementById('f-genre')?.value;
  const chefGe = formGenre || p.genre || getChefGenre(editingProjet?.chefId||'');
  const genreTag = chefGe==='F'?' (♀️)':chefGe==='M'?' (♂️)':'';
  let subject, body;
  if (lang==='fr') {
    subject = `${nomFilm} | ${p.real||'[Réal]'} | ${chefNom}`;
    if (isRelance) {
      body = `Hello [prénom],\n\nJe me permets de vous relancer concernant le film ${nomFilm} sur lequel notre chef opérateur${genreTag} ${chefNom} a travaillé.\nEst-ce que ce serait possible de nous envoyer un lien pour le télécharger ?\n\nMerci d'avance,\nBelle journée,`;
    } else {
      body = `Hello [prénom],\n\nEst-ce que ce serait possible de m'envoyer le film ${nomFilm} sur lequel notre chef opérateur${genreTag} ${chefNom} a travaillé ?\n\nMerci d'avance,\nBelle journée,`;
    }
  } else {
    subject = `${nomFilm} | ${p.real||'[Dir]'} | ${chefNom}`;
    if (isRelance) {
      body = `Hello [first name],\n\nI'm following up regarding the film ${nomFilm} that our director of photography ${chefNom} worked on.\nWould it be possible to send us a link to download it?\n\nThank you in advance,\nHave a great day,`;
    } else {
      body = `Hello [first name],\n\nWould it be possible to send me the film ${nomFilm} that our director of photography ${chefNom} worked on?\n\nThank you in advance,\nHave a great day,`;
    }
  }

  document.getElementById('email-content').innerHTML = `
    <div class="email-subject"><strong>Objet :</strong> ${esc(subject)}</div>
    <div class="email-box" id="email-body">${esc(body)}</div>`;
}

function setEmailLang(lang, btn) {
  currentEmailLang = lang;
  document.querySelectorAll('#modal .email-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (editingProjet) {
    const co = DATA.chef_ops.find(c=>c.id===editingProjet.chefId);
    const p = co.projets.find(pr=>pr.id===editingProjet.projetId);
    // Merge form values into p temporarily
    const tmp = {...p,
      projet:document.getElementById('f-projet').value,
      production:document.getElementById('f-production').value,
      real:document.getElementById('f-real').value,
      genre:document.getElementById('f-genre').value, // temporaire pour le preview
    };
    renderIndividualEmail(tmp, co.nom);
  }
}

function copyEmail() {
  const el = document.getElementById('email-body');
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(()=>showNotif('📋 Email copié !'));
}

function saveModal() {
  if (!editingProjet) return;
  const {chefId,projetId} = editingProjet;
  const co = DATA.chef_ops.find(c=>c.id===chefId);
  const p = co.projets.find(pr=>pr.id===projetId);
  p.projet = document.getElementById('f-projet').value;
  p.production = document.getElementById('f-production').value;
  p.real = document.getElementById('f-real').value;
  p.statut = document.getElementById('f-statut').value;
  p.dernier_contact = document.getElementById('f-contact').value||null;
  p.date_sortie_prevue = document.getElementById('f-sortie').value||null;
  p.date_relance = document.getElementById('f-relance').value||null;
  p.annee_tournage = document.getElementById('f-annee').value||'';
  p.contact_email = document.getElementById('f-email').value||'';
  // Genre sauvegardé au niveau du chef op (s'applique à tous ses films)
  co.genre = document.getElementById('f-genre').value||'';
  p.notes = document.getElementById('f-notes').value;
  closeModal();
  buildSidebar();
  applyFilters();
  showNotif('✅ Projet mis à jour');
  scheduleAutoSave();
}

function closeModal() { document.getElementById('modal').style.display='none'; editingProjet=null; }

function showNotif(msg) {
  const n = document.createElement('div');
  n.className='notif'; n.textContent=msg;
  document.body.appendChild(n);
  setTimeout(()=>n.remove(),3000);
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){closeModal();closeModalGroupe();} });
</script>
</body>
